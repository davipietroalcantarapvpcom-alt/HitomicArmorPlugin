# =====================================================================
#  HitomicArmor - configuração
#  Cores: use & (ex.: &5 roxo escuro, &d roxo claro, &c vermelho).
#  Depois de editar, use /hitomic recarregar (precisa de hitomicarmor.admin).
# =====================================================================

effects:
  # A cada quantos ticks o plugin verifica os equipamentos de cada jogador (20 ticks = 1s).
  check-interval-ticks: 10
  # Duração (ticks) dos efeitos aplicados; eles são renovados automaticamente enquanto
  # as condições forem cumpridas. 400 ticks = 20s.
  duration-ticks: 400
  # Nível de cada efeito por situação (1 = nível I, 2 = nível II ...; 0 = não aplica).
  levels:
    armor:        # 4 peças da armadura Hitomic
      strength: 2
      speed: 2
      regeneration: 1
    wing:         # Asa Hitomic na mão secundária (offhand)
      strength: 1
      speed: 1
      regeneration: 0
    combo:        # armadura completa + Asa Hitomic no offhand (substitui os outros níveis)
      strength: 3
      speed: 3
      regeneration: 1

items:
  # durability: 0 = igual ao item base (Netherite para armadura/ferramentas/espada,
  # vanilla para arco e escudo). Valores > 0 sobrescrevem a durabilidade máxima.
