name: Build HitomicArmor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: HitomicArmor/pom.xml

      - name: Compilar plugin
        run: mvn -B -f HitomicArmor/pom.xml clean package

      - name: Salvar JAR
        uses: actions/upload-artifact@v4
        with:
          name: HitomicArmor
          path: HitomicArmor/target/HitomicArmor.jar
