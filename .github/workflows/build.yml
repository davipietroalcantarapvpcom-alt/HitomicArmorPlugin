name: Build HitomicArmor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar plugin
        run: mvn -B clean package

      - name: Salvar JAR
        uses: actions/upload-artifact@v4
        with:
          name: HitomicArmor
          path: target/HitomicArmor.jar
